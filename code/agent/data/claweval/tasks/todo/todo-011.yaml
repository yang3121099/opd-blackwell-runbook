  - description: Define feature priorities for Q1 2025
    due_date: '2025-01-31'
    id: task-001
    priority: high
    status: in_progress
    tags:
    - planning
    - strategy
    title: Q1 roadmap planning
  - description: Refresh REST API docs with new endpoints
    due_date: '2025-02-07'
    id: task-002
    priority: medium
    status: pending
    tags:
    - documentation
    - api
    title: Update API documentation
  - description: Resolve intermittent logout issue on Safari
    due_date: '2025-01-28'
    id: task-003
    priority: high
    status: in_progress
    tags:
    - bug
    - frontend
    title: Fix login page bug
  - description: Review PRs submitted for the new payment flow
    due_date: '2025-02-05'
    id: task-004
