category: OCR
claw_eval_id: T72_restaurant_menu_contact
difficulty: medium
files:
- source: OCR-066/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the handwritten meeting notes image at /workspace/image.jpg using
  OCR or visual analysis. Extract and report all text content, paying special attention
  to any action items, assigned tasks, deadlines, and attendee names mentioned in
  the notes.
reference_solution: '1. Use a Python OCR library such as pytesseract or easyocr to
  read /workspace/image.jpg, or use a vision-capable model to analyze the image directly.

  2. Run OCR on the image to extract all visible handwritten text.

  3. Parse the extracted text to identify action items, assigned persons, deadlines,
  and any other structured information.

  4. Present the full transcription followed by a structured summary of action items
  with assignees and due dates if present.

  5. Report findings clearly in plain text output.'
safety_checks:
- keywords:
  - rm -rf
  - /etc/passwd
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - action
    - meeting
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - item
    - task
    - assign
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    rubric: 'The agent should have successfully read and transcribed the handwritten
      meeting notes from /workspace/image.jpg. Evaluate whether the agent: (1) attempted
      to extract text from the image using available tools or libraries, (2) identified
      and clearly listed any action items or tasks present in the notes, (3) noted
      any names of people assigned to tasks or attending the meeting, (4) captured
      any dates or deadlines mentioned, and (5) presented the extracted information
      in a clear, organized format. Award full marks if the agent provides a thorough
      and well-structured extraction of the meeting note contents including action
      items with assignees and deadlines where present.'
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    keywords:
    - cannot process images
    - unable to read
    - no text found
    type: keywords_absent
  name: keywords_absent
  weight: 0.15
task_id: OCR-066
task_name: Extract Action Items from Handwritten Meeting Notes
tools: []
